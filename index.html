<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI短视频制作中台</title>
<style>
:root {
  --bg: #0f0f14;
  --card: #1a1a24;
  --card-hover: #242438;
  --text: #e8e8f0;
  --text-dim: #8888a0;
  --accent: #6c5ce7;
  --accent-glow: rgba(108,92,231,0.3);
  --danger: #e74c3c;
  --radius: 18px;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
  min-height: 100vh;
  user-select: none;
  -webkit-user-select: none;
}

body::before {
  content: '';
  position: fixed;
  top: -300px; left: -300px;
  width: 600px; height: 600px;
  background: radial-gradient(circle, var(--accent-glow), transparent 70%);
  pointer-events: none;
}

.header {
  text-align: center;
  padding: 50px 20px 30px;
}
.header h1 {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: 2px;
  background: linear-gradient(135deg, #a78bfa, #6c5ce7, #3b82f6);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header p {
  margin-top: 8px;
  color: var(--text-dim);
  font-size: 14px;
}

.grid-container {
  max-width: 960px;
  margin: 0 auto;
  padding: 0 40px 40px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 20px;
  justify-items: center;
}

.card {
  width: 140px;
  height: 160px;
  background: var(--card);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s ease;
  position: relative;
  border: 1px solid rgba(255,255,255,0.05);
}
.card:hover {
  background: var(--card-hover);
  transform: translateY(-4px);
  box-shadow: 0 12px 36px rgba(0,0,0,0.4), 0 0 0 1px var(--accent-glow);
}
.card:active { transform: scale(0.96); }

.card .icon-wrapper {
  width: 64px;
  height: 64px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 10px;
  overflow: hidden;
}
.card .icon-wrapper img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.card .name {
  font-size: 13px;
  text-align: center;
  line-height: 1.3;
  max-width: 120px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Add card */
.card.add {
  border: 2px dashed rgba(255,255,255,0.1);
  background: transparent;
  opacity: 0.6;
}
.card.add:hover {
  opacity: 1;
  border-color: var(--accent);
  box-shadow: 0 0 20px var(--accent-glow);
}
.card.add .icon-wrapper {
  background: transparent !important;
  font-size: 36px;
  color: var(--text-dim);
}

/* Context menu */
.context-menu {
  position: fixed;
  background: #1e1e2e;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 6px;
  min-width: 140px;
  z-index: 1000;
  box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  display: none;
}
.context-menu.show { display: block; }
.context-menu .menu-item {
  padding: 8px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.context-menu .menu-item:hover { background: rgba(255,255,255,0.08); }
.context-menu .menu-item.danger { color: var(--danger); }

/* Modal */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
.modal-overlay.show {
  opacity: 1;
  pointer-events: all;
}
.modal {
  background: #1e1e2e;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 30px;
  width: 420px;
  max-width: 90vw;
  box-shadow: 0 24px 64px rgba(0,0,0,0.5);
}
.modal .title {
  font-size: 18px;
  margin-bottom: 20px;
  font-weight: 600;
}
.modal .field { margin-bottom: 16px; }
.modal label {
  display: block;
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.modal input[type="text"],
.modal input[type="url"] {
  width: 100%;
  padding: 10px 14px;
  background: #12121a;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  color: var(--text);
  font-size: 14px;
  outline: none;
}
.modal input:focus { border-color: var(--accent); }

.type-toggle {
  display: flex;
  gap: 0;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
}
.type-btn {
  flex: 1;
  padding: 8px 0;
  border: none;
  background: transparent;
  color: var(--text-dim);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}
.type-btn.active {
  background: var(--accent);
  color: #fff;
}

.card .badge {
  position: absolute;
  top: 8px;
  right: 8px;
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
  background: rgba(255,255,255,0.1);
  color: var(--text-dim);
}

.modal .icon-preview {
  display: flex;
  gap: 12px;
  align-items: center;
}
.modal .icon-preview .preview-box {
  width: 56px; height: 56px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
  overflow: hidden;
}
.modal .icon-preview .preview-box img {
  width: 100%; height: 100%; object-fit: cover;
}
.modal .icon-upload {
  font-size: 12px;
  padding: 6px 12px;
  background: var(--card);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 6px;
  color: var(--text-dim);
  cursor: pointer;
}
.modal .icon-upload:hover {
  border-color: var(--accent);
  color: var(--text);
}

.modal .btn-row {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 24px;
}
.btn {
  padding: 10px 22px;
  border-radius: 8px;
  border: none;
  font-size: 14px;
  cursor: pointer;
  font-weight: 500;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { filter: brightness(1.1); }
.btn-ghost {
  background: transparent;
  color: var(--text-dim);
  border: 1px solid rgba(255,255,255,0.1);
}
.btn-ghost:hover { color: var(--text); border-color: rgba(255,255,255,0.3); }

/* Toolbar */
.toolbar {
  text-align: center;
  padding: 0 20px 50px;
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}
.toolbar .btn-tool {
  padding: 8px 18px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.08);
  background: var(--card);
  color: var(--text-dim);
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
}
.toolbar .btn-tool:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }

/* Drag */
.card.drag-over {
  transform: scale(1.05);
  border-color: var(--accent);
  box-shadow: 0 0 24px var(--accent-glow);
}
.card.dragging { opacity: 0.4; }

/* Toast */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: #2d2d3f;
  color: #fff;
  padding: 10px 24px;
  border-radius: 8px;
  font-size: 13px;
  z-index: 3000;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <h1>AI短视频制作中台</h1>
  <p>右键图标管理工具 | 拖拽调整排序 | 数据保存在本地浏览器</p>
</div>

<div class="grid-container">
  <div class="grid" id="grid"></div>
</div>

<div class="toolbar">
  <button class="btn-tool" onclick="exportData()">导出配置</button>
  <button class="btn-tool" onclick="importData()">导入配置</button>
  <button class="btn-tool" onclick="resetDefaults()">恢复默认</button>
</div>

<div class="context-menu" id="ctxMenu">
  <div class="menu-item" onclick="ctxOpen()">打开</div>
  <div class="menu-item" onclick="ctxEdit()">编辑</div>
  <div class="menu-item danger" onclick="ctxDelete()">删除</div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="title" id="modalTitle">添加工具</div>
    <div class="field">
      <label>工具名称</label>
      <input type="text" id="inputName" placeholder="例如：豆包">
    </div>
    <div class="field">
      <label>类型</label>
      <div class="type-toggle">
        <button class="type-btn active" id="btnTypeUrl" onclick="switchType('url')">网址</button>
        <button class="type-btn" id="btnTypeApp" onclick="switchType('app')">本地程序</button>
      </div>
    </div>
    <div class="field" id="fieldUrl">
      <label>网址</label>
      <input type="url" id="inputUrl" placeholder="https://...">
    </div>
    <div class="field" id="fieldApp" style="display:none">
      <label>程序路径</label>
      <div style="display:flex;gap:8px;">
        <input type="text" id="inputAppPath" placeholder="例如：C:\Program Files\...\app.exe" style="flex:1">
        <button class="icon-upload" onclick="document.getElementById('appFile').click()">浏览...</button>
        <input type="file" id="appFile" accept=".exe,.lnk" style="display:none" onchange="handleAppFile(event)">
      </div>
    </div>
    <div class="field">
      <label>图标</label>
      <div class="icon-preview">
        <div class="preview-box" id="iconPreview"></div>
        <div>
          <input type="file" id="iconFile" accept="image/*" style="display:none" onchange="handleIconUpload(event)">
          <button class="icon-upload" onclick="document.getElementById('iconFile').click()">上传图片</button>
          <button class="icon-upload" onclick="clearIcon()" style="margin-left:4px">使用文字图标</button>
        </div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="btnSave">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'ai-video-hub-tools';

const COLORS = [
  '#6c5ce7','#3b82f6','#10b981','#f59e0b','#ef4444',
  '#8b5cf6','#ec4899','#06b6d4','#f97316','#84cc16',
  '#a78bfa','#2dd4bf','#fbbf24','#fb7185','#22d3ee'
];

const DEFAULT_TOOLS = [
  { id: '1', name: '豆包', url: 'https://www.doubao.com', icon: null, color: '#3b82f6' },
  { id: '2', name: '即梦AI', url: 'https://jimeng.jianying.com', icon: null, color: '#8b5cf6' },
  { id: '3', name: '剪映', url: 'https://www.jianying.com', icon: null, color: '#10b981' },
  { id: '4', name: '可灵AI', url: 'https://klingai.com', icon: null, color: '#ec4899' },
  { id: '5', name: '通义万相', url: 'https://tongyi.aliyun.com/wanxiang', icon: null, color: '#f97316' },
  { id: '6', name: '文心一言', url: 'https://yiyan.baidu.com', icon: null, color: '#06b6d4' },
];

function loadTools() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return DEFAULT_TOOLS.map(function(t) { return Object.assign({}, t); });
}

function saveTools(list) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}

function getColor(tool, idx) {
  if (tool.color) return tool.color;
  return COLORS[idx % COLORS.length];
}

var tools = loadTools();
var ctxTarget = null;
var editTarget = null;
var editingIconData = null;
var editingType = 'url';

function render() {
  var grid = document.getElementById('grid');
  grid.innerHTML = '';

  tools.forEach(function(t, i) {
    var card = document.createElement('div');
    card.className = 'card';
    card.draggable = true;
    card.dataset.index = i;

    var color = getColor(t, i);
    var iconWrap = document.createElement('div');
    iconWrap.className = 'icon-wrapper';
    iconWrap.style.background = t.icon ? 'transparent' : color;

    if (t.icon) {
      var img = document.createElement('img');
      img.src = t.icon;
      iconWrap.appendChild(img);
    } else {
      iconWrap.textContent = t.name.charAt(0);
    }

    var nameEl = document.createElement('div');
    nameEl.className = 'name';
    nameEl.textContent = t.name;

    card.appendChild(iconWrap);
    card.appendChild(nameEl);

    if (t.type === 'app') {
      var badge = document.createElement('div');
      badge.className = 'badge';
      badge.textContent = '本地';
      card.appendChild(badge);
    }

    card.addEventListener('click', function(e) {
      if (e.button !== 0) return;
      if (t.type === 'app') {
        window.location.href = 'launch://run/' + encodeURIComponent(t.exePath);
      } else {
        window.open(t.url, '_blank');
      }
    });
    card.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      ctxTarget = t.id;
      showCtxMenu(e.clientX, e.clientY);
    });
    card.addEventListener('auxclick', function(e) {
      if (e.button !== 1) return;
      if (t.type === 'app') {
        window.location.href = 'launch://run/' + encodeURIComponent(t.exePath);
      } else {
        window.open(t.url, '_blank');
      }
    });

    // Drag
    card.addEventListener('dragstart', function(e) {
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', i.toString());
      setTimeout(function() { card.classList.add('dragging'); }, 0);
    });
    card.addEventListener('dragend', function() { card.classList.remove('dragging'); });
    card.addEventListener('dragover', function(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      card.classList.add('drag-over');
    });
    card.addEventListener('dragleave', function() { card.classList.remove('drag-over'); });
    card.addEventListener('drop', function(e) {
      e.preventDefault();
      card.classList.remove('drag-over');
      var fromIdx = parseInt(e.dataTransfer.getData('text/plain'));
      var toIdx = i;
      if (fromIdx !== toIdx) {
        var moved = tools.splice(fromIdx, 1)[0];
        tools.splice(toIdx, 0, moved);
        saveTools(tools);
        render();
      }
    });

    grid.appendChild(card);
  });

  // Add button
  var addCard = document.createElement('div');
  addCard.className = 'card add';
  var addIcon = document.createElement('div');
  addIcon.className = 'icon-wrapper';
  addIcon.textContent = '+';
  var addName = document.createElement('div');
  addName.className = 'name';
  addName.textContent = '添加工具';
  addCard.appendChild(addIcon);
  addCard.appendChild(addName);
  addCard.addEventListener('click', function() { openModal(null); });
  grid.appendChild(addCard);
}

// Context menu
function showCtxMenu(x, y) {
  var menu = document.getElementById('ctxMenu');
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
  menu.classList.add('show');
}
function hideCtxMenu() {
  document.getElementById('ctxMenu').classList.remove('show');
}
function ctxOpen() {
  var t = tools.find(function(t) { return t.id === ctxTarget; });
  if (!t) return;
  if (t.type === 'app') {
    window.location.href = 'launch://run/' + encodeURIComponent(t.exePath);
  } else {
    window.open(t.url, '_blank');
  }
  hideCtxMenu();
}
function ctxEdit() {
  var t = tools.find(function(t) { return t.id === ctxTarget; });
  if (t) openModal(t.id);
  hideCtxMenu();
}
function ctxDelete() {
  tools = tools.filter(function(t) { return t.id !== ctxTarget; });
  saveTools(tools);
  render();
  toast('已删除');
  hideCtxMenu();
}

// Modal
function switchType(type) {
  editingType = type;
  document.getElementById('btnTypeUrl').classList.toggle('active', type === 'url');
  document.getElementById('btnTypeApp').classList.toggle('active', type === 'app');
  document.getElementById('fieldUrl').style.display = type === 'url' ? '' : 'none';
  document.getElementById('fieldApp').style.display = type === 'app' ? '' : 'none';
}

function openModal(toolId) {
  editTarget = toolId || null;
  editingIconData = null;
  document.getElementById('modalTitle').textContent = toolId ? '编辑工具' : '添加工具';
  document.getElementById('btnSave').textContent = toolId ? '保存修改' : '添加';

  if (toolId) {
    var t = tools.find(function(t) { return t.id === toolId; });
    document.getElementById('inputName').value = t.name;
    editingType = t.type || 'url';
    if (editingType === 'app') {
      document.getElementById('inputAppPath').value = t.exePath || '';
      document.getElementById('inputUrl').value = '';
    } else {
      document.getElementById('inputUrl').value = t.url || '';
      document.getElementById('inputAppPath').value = '';
    }
    switchType(editingType);
    editingIconData = t.icon || null;
    updateIconPreview(t);
  } else {
    document.getElementById('inputName').value = '';
    document.getElementById('inputUrl').value = '';
    document.getElementById('inputAppPath').value = '';
    switchType('url');
    updateIconPreview(null);
  }
  document.getElementById('iconFile').value = '';
  document.getElementById('appFile').value = '';
  document.getElementById('modalOverlay').classList.add('show');
  document.getElementById('inputName').focus();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
  editingIconData = null;
}

function updateIconPreview(tool) {
  var preview = document.getElementById('iconPreview');
  preview.innerHTML = '';
  if (tool && tool.icon) {
    var img = document.createElement('img');
    img.src = tool.icon;
    img.style.width = '100%';
    img.style.height = '100%';
    img.style.objectFit = 'cover';
    preview.appendChild(img);
    preview.style.background = 'transparent';
  } else {
    var name = tool ? tool.name : document.getElementById('inputName').value;
    preview.textContent = name ? name.charAt(0) : '?';
    preview.style.background = tool ? getColor(tool, 0) : '#6c5ce7';
  }
}

document.getElementById('inputName').addEventListener('input', function() {
  var nameEl = document.getElementById('inputName');
  var preview = document.getElementById('iconPreview');
  if (!editingIconData) {
    preview.innerHTML = '';
    preview.textContent = nameEl.value ? nameEl.value.charAt(0) : '?';
    preview.style.background = '#6c5ce7';
  }
});

function handleIconUpload(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function() {
    editingIconData = reader.result;
    var preview = document.getElementById('iconPreview');
    preview.innerHTML = '';
    preview.style.background = 'transparent';
    var img = document.createElement('img');
    img.src = reader.result;
    img.style.width = '100%';
    img.style.height = '100%';
    img.style.objectFit = 'cover';
    preview.appendChild(img);
  };
  reader.readAsDataURL(file);
}

function clearIcon() {
  editingIconData = null;
  var nameEl = document.getElementById('inputName');
  var preview = document.getElementById('iconPreview');
  preview.innerHTML = '';
  preview.textContent = nameEl.value ? nameEl.value.charAt(0) : '?';
  preview.style.background = '#6c5ce7';
  document.getElementById('iconFile').value = '';
}

function handleAppFile(e) {
  var file = e.target.files[0];
  if (!file) return;
  document.getElementById('inputAppPath').value = file.path || file.name;
}

document.getElementById('btnSave').addEventListener('click', function() {
  var name = document.getElementById('inputName').value.trim();

  if (!name) { toast('请输入工具名称'); return; }

  if (editingType === 'app') {
    var exePath = document.getElementById('inputAppPath').value.trim();
    if (!exePath) { toast('请选择程序路径'); return; }

    if (editTarget) {
      var t = tools.find(function(t) { return t.id === editTarget; });
      t.name = name;
      t.type = 'app';
      t.exePath = exePath;
      t.url = '';
      t.icon = editingIconData;
    } else {
      tools.push({
        id: Date.now().toString(),
        name: name,
        type: 'app',
        exePath: exePath,
        url: '',
        icon: editingIconData,
        color: COLORS[Math.floor(Math.random() * COLORS.length)]
      });
    }
  } else {
    var url = document.getElementById('inputUrl').value.trim();
    if (!url) { toast('请输入网址'); return; }
    if (!url.startsWith('http')) { toast('网址需以 http:// 或 https:// 开头'); return; }

    if (editTarget) {
      var t = tools.find(function(t) { return t.id === editTarget; });
      t.name = name;
      t.type = 'url';
      t.url = url;
      t.exePath = '';
      t.icon = editingIconData;
    } else {
      tools.push({
        id: Date.now().toString(),
        name: name,
        type: 'url',
        url: url,
        exePath: '',
        icon: editingIconData,
        color: COLORS[Math.floor(Math.random() * COLORS.length)]
      });
    }
  }

  saveTools(tools);
  render();
  closeModal();
  toast(editTarget ? '已更新' : '已添加');
});

// Toolbar
function exportData() {
  var blob = new Blob([JSON.stringify(tools, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ai-hub-tools-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  toast('配置已导出');
}

function importData() {
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function() {
      try {
        var data = JSON.parse(reader.result);
        if (!Array.isArray(data)) throw new Error('Invalid format');
        tools = data;
        saveTools(tools);
        render();
        toast('配置已导入 (' + data.length + ' 个工具)');
      } catch (err) {
        toast('导入失败：文件格式不正确');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function resetDefaults() {
  if (!confirm('确定要恢复默认工具列表吗？当前配置将被覆盖。')) return;
  tools = DEFAULT_TOOLS.map(function(t) { return Object.assign({}, t); });
  saveTools(tools);
  render();
  toast('已恢复默认 (' + tools.length + ' 个工具)');
}

// Toast
var toastTimer;
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.classList.remove('show'); }, 2000);
}

document.addEventListener('click', function(e) {
  if (!e.target.closest('.context-menu')) hideCtxMenu();
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { hideCtxMenu(); closeModal(); }
});
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === e.currentTarget) closeModal();
});

render();
</script>
</body>
</html>
